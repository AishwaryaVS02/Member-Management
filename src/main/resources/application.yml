spring:
  application:
    name: member-management

  datasource:
    url: jdbc:postgresql://localhost:5432/member_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # IMPORTANT (Flyway manages schema)
      show-sql: true
    properties:
      format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true


server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000