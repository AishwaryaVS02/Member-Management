spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/member_db
    username: postgres
    password: ${TEST_DB_PASSWORD:Nutan@001}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: none

jwt:
  secret: ${TEST_JWT_SECRET:test-secret-key-1234567890123456}
  expiration: 86400000
